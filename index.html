<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <!-- UI Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* Stats card shadow and radius */
        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #f1f5f9;
        }
    </style>

</head>
    <body class="min-h-screen p-6 md:p-16">

    <div class="max-w-4xl mx-auto">

        <!-- App Header -->
        <h1 class="text-3xl font-extrabold text-slate-800 mb-8">Job Application Tracker</h1>

        <!-- Stats Counter Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <!-- Total Jobs -->
            <div class="stats-card">
                <p class="text-sm font-bold text-gray-400 mb-1">Total</p>
                <div id="total-count" class="text-4xl font-black text-slate-800">0</div>
            </div>

            <!-- Interview Jobs -->
            <div class="stats-card">
                <p class="text-sm font-bold text-gray-400 mb-1">Interview</p>
                <div id="interview-count" class="text-4xl font-black text-green-500">0</div>
            </div>

            <!-- Rejected Jobs -->
            <div class="stats-card">
                <p class="text-sm font-bold text-gray-400 mb-1">Rejected</p>
                <div id="rejected-count" class="text-4xl font-black text-red-500">0</div>
            </div>
        </div>
<!-- Jobs Header and Tabs -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-extrabold text-slate-700">Available Jobs</h2>
            <span id="jobs-header-count" class="text-sm font-bold text-gray-400">0 jobs</span>
        </div>

        <!-- Filter Tabs (Buckets) -->
        <div id="filters" class="flex gap-2 mb-8">
            <!-- 'All' refers to 'available' jobs in beginner logic -->
            <button id="filter-all" onclick="filterJobs('available')"
                class="btn btn-sm btn-primary rounded-md capitalize px-6 font-bold">All</button>
            <button id="filter-interview" onclick="filterJobs('interview')"
                class="btn btn-sm bg-white text-gray-500 border-gray-200 hover:bg-gray-50 rounded-md capitalize px-6 font-bold">Interview</button>
            <button id="filter-rejected" onclick="filterJobs('rejected')"
                class="btn btn-sm bg-white text-gray-500 border-gray-200 hover:bg-gray-50 rounded-md capitalize px-6 font-bold">Rejected</button>
        </div>
 <!-- Container for Job Cards / Empty State -->
        <div id="job-list">
            <!-- Content will be injected by JavaScript -->
        </div>

    </div>
     <!-- JavaScript logic -->
    <script src="script.js"></script>
    
</body>
</html>
